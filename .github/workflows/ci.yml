name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://synapse:example@localhost:5432/synapse
      SITE_URL: http://localhost:3000
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: synapse
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: example
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synapse -d synapse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le secret Auth.js éphémère
        shell: bash
        run: |
          auth_secret="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$auth_secret"
          echo "AUTH_SECRET=$auth_secret" >> "$GITHUB_ENV"

      - name: Bloquer les modifications de la pipeline
        if: github.event_name == 'pull_request'
        run: git diff --name-only origin/main... | grep -q '^docs/pipeline-dev/' && exit 1 || test $? -eq 1

      - name: Lint
        run: npm run lint

      - name: Vérifier les types
        run: npm run type-check

      - name: Appliquer les migrations
        run: npx prisma migrate deploy

      - name: Peupler la base de démonstration
        run: npx prisma db seed

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Tests E2E
        run: npm run e2e

      - name: Audit des dépendances
        run: npm audit
